<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BipView — todo o seu portfólio cripto, num só lugar</title>
  <meta name="description" content="Espelho de portfólio cripto, somente leitura. Exchanges e carteiras num painel só.">
  <link rel="alternate" hreflang="pt" href="https://bipview.com/pt/">
    <link rel="alternate" hreflang="es" href="https://bipview.com/es/">
    <link rel="alternate" hreflang="en" href="https://bipview.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://bipview.com/pt/">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0B1017;color:#E7EDF4;font-family:system-ui,-apple-system,sans-serif}
    .c{text-align:center;padding:24px}
    .c p{color:#8FA3B8;font-size:14px;margin:0 0 18px}
    .c a{display:inline-block;margin:0 8px;padding:10px 18px;border:1px solid #24313F;
         border-radius:10px;color:#E7EDF4;text-decoration:none;font-size:15px}
  </style>
  <script>
    // Idioma do navegador -> pasta. Sem correspondencia, ingles (o denominador comum da regiao).
    (function () {
      var l = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var destino = (l === 'pt' || l === 'es') ? l : 'en';
      location.replace('/' + destino + '/');
    })();
  </script>
</head>
<body>
  <div class="c">
    <p>BipView</p>
    <noscript><p>Escolha o idioma / Elige el idioma / Choose your language</p></noscript>
    <div>
      <a href="/pt/">Português</a>
      <a href="/es/">Español</a>
      <a href="/en/">English</a>
    </div>
  </div>
</body>
</html>
