<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BipView — abrindo o app</title>
<!-- ATALHO bipview.com/app -> app web de PRD (MKT, 27/09/2026). Existe para quem esta no iPhone antes de o app
     chegar a App Store (inscricao da Apple pendente) abrir o BipView pelo Safari. Sem rastreador, fora do sitemap.
     16/11/2026: o atalho leva ao app a etiqueta de origem. Se o link de entrada trouxe uma (a chave `o` ou as
     utm_*), vai ela; senao vai a chave do proprio atalho (atalho-app, em catalogo/origens.csv). Nada e guardado
     nem enviado daqui: /origem.js so monta o endereco. Sem JavaScript, o redirecionamento abaixo leva a chave
     do atalho depois de 1 segundo. -->
<meta http-equiv="refresh" content="1; url=https://app.bipview.com/?o=atalho-app">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0b0d; color: #e8eaed;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 16px; }
  a { color: #6fa8ff; }
</style>
</head>
<body>
<p>Abrindo o BipView… Se não abrir, <a href="https://app.bipview.com/?o=atalho-app" data-loja="web">toque aqui</a>.</p>
<script src="/origem.js"></script>
<script>
(function () {
  var destino = 'https://app.bipview.com/?o=atalho-app';
  try { destino = window.bipviewOrigem.montar(destino, 'web', window.bipviewOrigem.entrada(location.search)); } catch (e) {}
  location.replace(destino);
})();
</script>
</body>
</html>
